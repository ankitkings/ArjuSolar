name: Deploy to EC2

on:
  push:
    branches: [ arju-solar-first-phase ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # Load rbenv
            export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"
            eval "$(rbenv init - bash)"
            
            # Load SECRET_KEY_BASE
            export SECRET_KEY_BASE=$(grep SECRET_KEY_BASE ~/.bashrc | cut -d '=' -f2)
            
            cd /home/ubuntu/ArjuSolar
            
            echo ">>> Pulling latest code..."
            git fetch origin
            git reset --hard origin/arju-solar-first-phase
            
            echo ">>> Installing gems..."
            bundle install --without development test --deployment
            
            echo ">>> Running migrations..."
            RAILS_ENV=production bundle exec rake db:migrate
            
            # Uncomment only when needed
            # RAILS_ENV=production bundle exec rake db:seed
            
            echo ">>> Precompiling assets..."
            RAILS_ENV=production bundle exec rails assets:precompile
            
            echo ">>> Restarting Rails server..."
            pkill -f "rails server" || true
            sleep 2
            
            nohup RAILS_ENV=production bundle exec rails server -b 0.0.0.0 -p 3000 > log/production.log 2>&1 &
            
            echo ">>> Deployment completed successfully!"